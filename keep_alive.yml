name: Supabase Keep Alive

on:
  schedule:
    # Se ejecuta cada día a las 00:00 UTC (puedes ajustarlo)
    # Para cada 8 horas sería: "0 */8 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send Ping to Supabase API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -X GET "$SUPABASE_URL/rest/v1/categories?select=name" \
          -H "apikey: $SUPABASE_ANON_KEY" \
          -H "Authorization: Bearer $SUPABASE_ANON_KEY"

          # Nota: Esta petición simplemente consulta los nombres de las categorías.
          # Es suficiente para que Supabase detecte tráfico en la base de datos.
          # Debes configurar SUPABASE_URL y SUPABASE_ANON_KEY en los Secrets de tu Repo.
